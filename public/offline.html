<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>Amezing Limited — Offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f9f8; color: #123b34; }
      main { max-width: 420px; padding: 32px; text-align: center; }
      h1 { margin-bottom: 8px; }
      p { line-height: 1.6; color: #475569; }
    </style>
  </head>
  <body>
    <main>
      <h1>Amezing Limited</h1>
      <p>You are offline. Amezing cannot safely load or save live financial and inventory records until your internet connection returns.</p>
      <p>Reconnect to the internet, then try again. Do not enter the same transaction repeatedly if you are unsure whether it saved.</p>
      <button type="button" onclick="location.reload()" style="margin-top:12px;border:0;border-radius:10px;background:#123b34;color:#fff;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer">Try again</button>
    </main>
  </body>
</html>
